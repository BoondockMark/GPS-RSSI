[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-rssi"
version = "0.1.0"
description = "Offline RF coverage measurement and Benlink Bluetooth diagnostics"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
bluetooth = ["benlink @ git+https://github.com/khusmann/benlink.git@c4b9d22112402ea193d376f412bc028d1778fdb4", "tomlkit>=0.13,<1"]
audio = ["numpy>=1.26,<3", "scipy>=1.11,<2", "av>=12,<17", "winrt-Windows.Devices.Bluetooth>=3,<4; sys_platform == 'win32'", "winrt-Windows.Devices.Bluetooth.Rfcomm>=3,<4; sys_platform == 'win32'", "winrt-Windows.Networking.Sockets>=3,<4; sys_platform == 'win32'", "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'"]

[project.scripts]
gps-rssi = "gps_rssi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gps_rssi = ["assets/*.geojson", "assets/*.json", "assets/*.js", "assets/*.html", "assets/*.css", "profiles/*.toml", "assets/leaflet/*"]
