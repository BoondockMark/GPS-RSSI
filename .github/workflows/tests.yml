name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            venv-python: .venv/bin/python
          - os: windows-latest
            venv-python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install on Linux
        if: runner.os == 'Linux'
        run: ./install.sh
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call install.cmd
      - run: ${{ matrix.venv-python }} -m unittest discover -s tests -v
      - run: node tests/basemap.test.cjs
      - run: node tests/dashboard.test.cjs
      - run: node tests/workspace-status.test.cjs
      - run: node tests/results-model.test.cjs
      - run: node tests/combined-map.test.cjs
      - run: node tests/visualization.test.cjs
      - run: node tests/survey.test.cjs
      - run: node tests/route-analysis.test.cjs
      - name: Install browser test tools
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          .venv/bin/python -m pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Operator workspace browser workflow
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: .venv/bin/python tests/workspace_browser.py
      - name: Linux launcher
        if: runner.os == 'Linux'
        run: ./scripts/run-gps-rssi.sh --help
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\run-gps-rssi.cmd --help < NUL
